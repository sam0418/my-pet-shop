version: '3.8'

services:
  # PostgreSQL 數據庫
  db:
    image: postgres:15-alpine
    container_name: petfood-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: petfood
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petfood-network

  # 後端 API 服務器
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petfood-backend
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: petfood
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - petfood-network
    command: npm start

  # 前端應用
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petfood-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - petfood-network
    command: npm start

volumes:
  postgres_data:

networks:
  petfood-network:
    driver: bridge
