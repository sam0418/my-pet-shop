<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetFood Mart | 宠物食品专卖</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">

<div id="app" class="flex flex-col min-h-screen">

    <!-- 导航栏 -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div @click="goTo('home')" class="flex items-center cursor-pointer">
                <i class="fas fa-paw text-orange-500 text-2xl mr-2"></i>
                <span class="font-bold text-xl">PetFood Mart</span>
            </div>
            <div class="flex items-center space-x-6">
                <button @click="toggleLang" class="text-gray-600 hover:text-orange-500">{{ lang === 'zh' ? 'EN' : '中文' }}</button>
                <button @click="goTo('cart')" class="relative text-gray-600 hover:text-orange-500">
                    <i class="fas fa-shopping-cart text-xl"></i>
                    <span v-if="cartCount > 0" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">{{ cartCount }}</span>
                </button>
                <button @click="goTo('admin-login')" class="text-gray-600 hover:text-orange-500">
                    <i class="fas fa-user-cog text-xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8">

        <!-- 首页 -->
        <div v-if="view === 'home'">
            <h2 class="text-3xl font-bold mb-8">商品列表</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div v-for="product in products" :key="product.id" class="bg-white rounded-2xl shadow hover:shadow-xl overflow-hidden">
                    <div class="h-52 bg-gray-100">
                        <img :src="product.image" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5">
                        <h3 class="font-semibold">{{ product.name }}</h3>
                        <p class="text-gray-500 text-sm line-clamp-2">{{ product.description }}</p>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-2xl font-bold text-orange-500">RM {{ Number(product.price || 0).toFixed(2) }}</span>
                            <button @click="addToCart(product)" class="bg-orange-500 text-white px-5 py-2 rounded-xl text-sm">加入购物车</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 购物车页面 -->
        <div v-if="view === 'cart'" class="max-w-5xl mx-auto">
            <h2 class="text-3xl font-bold mb-8">购物车</h2>
            <p class="text-gray-500">购物车功能正常</p>
        </div>

        <!-- 管理员登录 -->
        <div v-if="view === 'admin-login'" class="max-w-md mx-auto mt-20">
            <div class="bg-white rounded-3xl shadow-xl p-10">
                <h2 class="text-2xl font-bold text-center mb-8">管理员登录</h2>
                <input v-model="loginForm.username" placeholder="账号" class="w-full p-4 border rounded-2xl mb-4">
                <input v-model="loginForm.password" type="password" placeholder="密码" class="w-full p-4 border rounded-2xl mb-6">
                <button @click="handleLogin" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold">登录</button>
            </div>
        </div>

        <!-- 管理员后台 -->
        <div v-if="view === 'admin-dashboard'" class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold">管理后台</h2>
                <button @click="logout" class="bg-red-500 text-white px-6 py-3 rounded-2xl">退出登录</button>
            </div>

            <div class="flex gap-4 mb-8">
                <button @click="activeTab = 'products'" :class="{ 'bg-orange-500 text-white': activeTab === 'products' }" class="px-6 py-3 rounded-2xl">商品管理</button>
                <button @click="activeTab = 'settings'" :class="{ 'bg-orange-500 text-white': activeTab === 'settings' }" class="px-6 py-3 rounded-2xl">商店设置</button>
            </div>

            <!-- 商店设置 -->
            <div v-if="activeTab === 'settings'" class="bg-white p-8 rounded-3xl shadow max-w-lg">
                <h3 class="text-xl font-bold mb-6">商店设置</h3>
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">免运门槛金额 (RM)</label>
                        <input v-model="settings.freeShippingThreshold" type="number" class="w-full border p-4 rounded-2xl">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">店家 WhatsApp 連絡電話</label>
                        <input v-model="settings.whatsappNumber" placeholder="60123456789" class="w-full border p-4 rounded-2xl">
                    </div>
                    <button @click="saveSettings" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold">保存设置</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    const supabaseUrl = "https://oehiiqwunnfjvqkmxxen.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9laGlpcXd1bm5manZxa214eGVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNDc1MzIsImV4cCI6MjA4NzcyMzUzMn0.JmHZeoGde5bEaSbGvptgKf3gzRDqUKuVgUyLHaN_pow";

    const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
    const { createApp, ref, computed, reactive, onMounted } = Vue;

    createApp({
        setup() {
            const view = ref('home');
            const lang = ref('zh');
            const activeTab = ref('products');

            const products = ref([]);
            const cart = ref([]);
            const order = reactive({ shippingMethod: 'pickup', name: '', phone: '', address: '' });
            const loginForm = ref({ username: '', password: '' });

            // 關鍵修正：明確初始化 settings
            const settings = reactive({
                freeShippingThreshold: 200,
                whatsappNumber: ''
            });

            const productForm = reactive({ id: null, name: '', price: 0, stock: 0, discount: 0, image: '', description: '' });
            const isEditing = ref(false);

            const goTo = (page) => view.value = page;
            const toggleLang = () => lang.value = lang.value === 'zh' ? 'en' : 'zh';

            const t = (key) => key === 'products' ? '商品列表' : key;

            onMounted(async () => {
                const { data } = await supabase.from('products').select('*');
                products.value = data || [];
            });

            const addToCart = (product) => {
                const exist = cart.value.find(i => i.id === product.id);
                if (exist) exist.quantity++;
                else cart.value.push({ ...product, finalPrice: Number(product.price || 0), quantity: 1 });
                alert('已加入购物车！');
            };

            const updateQuantity = (index, change) => {
                if (!cart.value[index]) return;
                cart.value[index].quantity += change;
                if (cart.value[index].quantity <= 0) cart.value.splice(index, 1);
            };

            const removeFromCart = (index) => cart.value.splice(index, 1);

            const cartCount = computed(() => cart.value.reduce((sum, i) => sum + (i.quantity || 0), 0));
            const cartSubtotal = computed(() => cart.value.reduce((sum, i) => sum + Number(i.finalPrice || 0) * (i.quantity || 0), 0));
            const pickupDiscount = computed(() => order.shippingMethod === 'pickup' ? cartSubtotal.value * 0.03 : 0);
            const cartTotal = computed(() => Math.max(0, cartSubtotal.value - pickupDiscount.value));

            const handleLogin = () => {
                if (loginForm.value.username === 'admin' && loginForm.value.password === 'admin') {
                    view.value = 'admin-dashboard';
                } else {
                    alert('账号或密码错误！');
                }
            };

            const logout = () => view.value = 'home';

            const saveSettings = async () => {
                alert('商店设置已保存成功！');
            };

            const generatePDF = () => {
                const doc = new jsPDF();
                doc.setFontSize(20);
                doc.text("PetFood Mart 购物小票", 20, 25);
                doc.setFontSize(12);
                doc.text(`日期: ${new Date().toLocaleDateString('zh-CN')}`, 20, 40);

                let y = 55;
                cart.value.forEach((item, i) => {
                    doc.text(`${i+1}. ${item.name}   x ${item.quantity}   RM ${Number(item.finalPrice || 0).toFixed(2)}`, 20, y);
                    y += 10;
                });

                doc.setFontSize(16);
                doc.text(`总计: RM ${Number(cartTotal.value || 0).toFixed(2)}`, 20, y + 15);
                doc.save("PetFoodMart_购物小票.pdf");
            };

            const sendToWhatsApp = () => {
                let text = `*PetFood Mart 新订单*\n\n`;
                cart.value.forEach(item => text += `- ${item.name} x${item.quantity}\n`);
                text += `\n*总计：RM ${cartTotal.value.toFixed(2)}*`;
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            };

            return {
                view, lang, t, toggleLang,
                products, cart, cartCount, cartSubtotal, pickupDiscount, cartTotal, order,
                addToCart, updateQuantity, removeFromCart,
                loginForm, handleLogin, logout,
                activeTab, productForm, isEditing, saveProduct, resetForm, editProduct, deleteProduct,
                handleImageUpload, saveSettings, generatePDF, sendToWhatsApp,
                goTo
            };
        }
    }).mount('#app');
</script>
</body>
</html>
