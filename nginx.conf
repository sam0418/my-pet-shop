# 前端 Nginx 配置 - 生產環境
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # 日誌格式
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  # 性能優化
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # Gzip 壓縮
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript 
             application/json application/javascript application/xml+rss 
             application/rss+xml application/atom+xml image/svg+xml 
             text/x-js text/x-component text/x-cross-domain-policy;
  gzip_disable "msie6";

  # 上游 API 服務器
  upstream api_backend {
    server backend:3001;
    keepalive 32;
  }

  # HTTP 強制重定向到 HTTPS（如果需要）
  # server {
  #   listen 80;
  #   server_name _;
  #   return 301 https://$host$request_uri;
  # }

  # 主服務器配置
  server {
    listen 3000 default_server;
    listen [::]:3000 default_server;
    
    server_name _;
    
    # 靜態文件根目錄
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 安全性頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval' unpkg.com cdn.jsdelivr.net cdn.tailwindcss.com cdnjs.cloudflare.com;" always;

    # 快取策略
    # 靜態資源（圖片、字體等）- 1年快取
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # API 代理
    location /api/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # SPA 路由 - 所有非檔案請求都導向 index.html
    location / {
      # 首先嘗試檔案
      try_files $uri $uri/ /index.html;
      
      # index.html 設置為不快取，以便獲得最新版本
      add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # 健康檢查端點
    location /healthz {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # 禁止訪問敏感檔案
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    location ~ ~$ {
      deny all;
      access_log off;
      log_not_found off;
    }

    # 自定義錯誤頁面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
      root /usr/share/nginx/html;
      internal;
    }
    
    location = /50x.html {
      root /usr/share/nginx/html;
      internal;
    }
  }
}
